<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Validador local de salida JSON</title>
  <style>
    body { font: 16px system-ui, sans-serif; margin: 3rem auto; max-width: 760px; padding: 0 1rem; color: #172033; }
    main { border: 1px solid #d5dbe5; border-radius: 12px; padding: 1.5rem; }
    button { background: #3730a3; border: 0; border-radius: 6px; color: white; cursor: pointer; padding: .7rem 1rem; }
    #result { margin-top: 1rem; white-space: pre-wrap; }
    .ok { color: #067647; } .bad { color: #b42318; }
  </style>
</head>
<body>
<main>
  <h1>Validador local de salida</h1>
  <p>Comprueba el contrato JSON descrito para el reto. Selecciona <code>salida.json</code>:</p>
  <input id="file" type="file" accept=".json,application/json">
  <button id="validate">Validar</button>
  <div id="result" aria-live="polite"></div>
</main>
<script>
const expected = ["reto", "repositorio", "commit", "inicio", "fin", "procesados", "ranking"];
const result = document.getElementById("result");
function validCaracasTime(value) {
  return typeof value === "string"
    && /^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d(?:\.\d+)?-04:00$/.test(value)
    && !Number.isNaN(Date.parse(value));
}
document.getElementById("validate").addEventListener("click", async () => {
  result.className = "";
  const file = document.getElementById("file").files[0];
  if (!file) { result.textContent = "Selecciona un archivo JSON."; result.className = "bad"; return; }
  try {
    const data = JSON.parse(await file.text());
    const errors = [];
    if (!data || Array.isArray(data) || typeof data !== "object") errors.push("La raíz debe ser un objeto JSON.");
    else {
      if (JSON.stringify(Object.keys(data).sort()) !== JSON.stringify([...expected].sort())) errors.push("Las claves superiores no coinciden exactamente con el esquema.");
      if (data.reto !== "propuesta_servicios") errors.push("reto debe ser propuesta_servicios.");
      for (const key of ["repositorio", "commit"]) if (typeof data[key] !== "string") errors.push(`${key} debe ser texto.`);
      for (const key of ["inicio", "fin"]) if (!validCaracasTime(data[key])) errors.push(`${key} debe ser ISO 8601 con offset -04:00.`);
      if (!Array.isArray(data.procesados)) errors.push("procesados debe ser una lista.");
      else data.procesados.forEach((item, index) => {
        if (!item || JSON.stringify(Object.keys(item).sort()) !== JSON.stringify(["archivo", "hora"])) errors.push(`procesados[${index}] debe tener solo archivo y hora.`);
        else {
          if (typeof item.archivo !== "string" || !item.archivo) errors.push(`procesados[${index}].archivo debe ser texto no vacío.`);
          if (!validCaracasTime(item.hora)) errors.push(`procesados[${index}].hora debe usar -04:00.`);
        }
      });
      if (!Array.isArray(data.ranking) || data.ranking.some(name => typeof name !== "string")) errors.push("ranking debe ser una lista de nombres.");
      else if (new Set(data.ranking).size !== data.ranking.length) errors.push("ranking contiene duplicados.");
    }
    if (errors.length) { result.textContent = "No válido:\n• " + errors.join("\n• "); result.className = "bad"; }
    else { result.textContent = "Válido según el contrato local especificado."; result.className = "ok"; }
  } catch (error) {
    result.textContent = `No se pudo validar el JSON: ${error.message}`;
    result.className = "bad";
  }
});
</script>
</body>
</html>
