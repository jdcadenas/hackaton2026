<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Propuesta Servicios{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
  <header class="border-b bg-white">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-5 py-4">
      <a href="/dashboard" class="font-bold tracking-tight text-indigo-800">Venezuela INNOVA <span class="text-slate-500">/ Propuestas</span></a>
      {% if user %}
      <nav class="flex items-center gap-4 text-sm">
        <a class="hover:text-indigo-700" href="/dashboard">Proyectos</a>
        <a class="hover:text-indigo-700" href="/suppliers">Proveedores</a>
        <span class="rounded-full bg-indigo-50 px-3 py-1 text-indigo-800">{{ user.username }} · {{ user.role }}</span>
        <form method="post" action="/logout"><button class="text-slate-600 hover:text-red-700">Salir</button></form>
      </nav>
      {% endif %}
    </div>
  </header>
  <main class="mx-auto max-w-7xl px-5 py-8">
    {% block content %}{% endblock %}
  </main>
  <footer class="mx-auto max-w-7xl px-5 pb-8 text-xs text-slate-500">Venezuela INNOVA 2026 · La decisión final corresponde a revisión humana.</footer>
</body>
</html>
